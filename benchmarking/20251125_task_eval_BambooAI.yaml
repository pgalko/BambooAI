          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: Perform Granger causality analysis between daily training load (from activity_summary) and next-day HRV (from wellness data) to determine the optimal lag and causal relationship strength. Also test reverse causality (does HRV predict next-day training load?).
          datasets: [wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
      search_enabled:
        - question: Research the concept of "functional overreaching" vs "non-functional overreaching" in endurance training. Using my wellness data trends (HRV, resting HR, fatigue scores) and performance data from primary_df (best powers at various durations), identify if any periods in 2025 showed signs of non-functional overreaching and subsequent recovery.
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: Look up the relationship between Heart Rate Variability (HRV) and parasympathetic recovery. Analyze my post-ride HRV recovery by comparing morning HRV on days following different training loads. Correlate with performance metrics extracted from primary_df to determine my individual HRV-performance relationship.
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0