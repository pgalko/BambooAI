  - category: Recovery and Readiness Analysis
    questions:
      coach_athlete:
        - question: On days following high training loads (power_load > 100), extract the next day's ride from primary_df (if any). Compare HR at equivalent power outputs (use power bins) between post-hard-day rides and post-easy-day rides. Does accumulated fatigue elevate my HR response?
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: Using wellness data, identify days where HRV dropped by >15% from the 7-day rolling average. Extract rides from these "compromised" days from primary_df and compare power distributions, time above threshold, and HR-power relationships to rides on "normal" HRV days.
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: Calculate my "recovery signature" from the primary dataframe. After hard efforts (>300W for >30s), how quickly does my HR return to baseline? Compute the HR recovery rate for all such efforts and track if this metric improves with higher CTL from wellness data.
          datasets: [primary_df, wellness_data]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: Track ramp rate from wellness data and identify "overreaching" periods (ramp rate >5 for 3+ consecutive days). From primary_df, compare performance metrics (best 20-min power, power variability, HR-power ratio) during overreaching periods vs normal periods. Is there a performance cost?
