categories:
  - category: Activity Overview and Basic Statistics
    questions:
      coach_athlete:
        - question: Calculate my monthly riding volume (total distance, number of activities, and total moving time) for each month in 2025. Also compute the percentage of time spent above 200W from the primary dataframe for each month and show how this "quality volume" metric changed across Q1 vs Q2 vs Q3.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Compare my average weekly training stress (power_load) between the first half and second half of 2025. Additionally, from the primary dataframe, calculate the weekly time spent in each power zone (Z1: <55% FTP, Z2: 55-75%, Z3: 75-90%, Z4: 90-105%, Z5: >105% ) and plot both metrics as stacked time series.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: For months where my average chronic training load (CTL) exceeded 100, compare my average ride distance AND the average percentage of each ride spent at threshold power (90-105% of FTP) versus months where CTL was below 80. Use the primary dataframe for the threshold calculation.
          datasets: [primary_df, activity_summary, wellness_data]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, compute the total elevation gain per ride by summing positive altitude changes between consecutive points. Compare this calculated elevation to the elevation_gain_m in activity_summary. Show rides where the discrepancy exceeds 10% and investigate potential causes.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      technical:
        - question: Calculate the coefficient of variation for power output at 1-second resolution within each ride longer than 80km, then aggregate to get monthly CV trends. Compare this intra-ride variability metric to the variability_index from activity_summary. Are they correlated?
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, calculate instantaneous gradient using altitude change over distance change (with appropriate smoothing to reduce noise). Create histograms of power output binned by gradient category (descent <-3%, flat -3% to 3%, moderate climb 3-6%, steep >6%). Show the power distributions for each gradient category.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      search_enabled:
        - question: Research the concept of "Training Impulse" (TRIMP) and its various calculation methods (Banister, Edwards, Lucia). Implement the Lucia TRIMP method using heart rate zones from my primary dataframe, then compare my calculated weekly TRIMP values to the hr_load values in activity_summary across all of 2025.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      # context_enabled: the window loaded with Context on (the context_notes and context_codes files beside the summary and wellness
      # files). The questions are asked as the coach or the rider would ask them, with no word of the system's - no codes, context,
      # passages or renderings - so the route is the system's to find; the 12-month window is named by month or by the data
      # (the week his power jumped, the last time he was ill), never 'this week'. The 'key' under each row is for the scorer, not
      # the model: what a good answer must do - use the words where they are needed, quote rather than paraphrase, name a count of
      # codes as the model's reading, use a window rather than a same-day match where the days can differ, say what rests on what.
      context_enabled:
        - question: Month by month over the year, how much did he ride and how much did he write about it? Does he write more in the big months or the quiet ones, and what does he tend to write about?
          datasets: [activity_summary, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the coach; key - numbers first, words counted: rides, distance and load per month from the summary beside what was written per month, by him and by the coach; the share of rides with something written on them; what he writes about from the codes or the analyst's own reading, said to be a reading either way; no quote needed

  - category: Performance Trends and Progression
    questions:
      coach_athlete:
        - question: Using the primary dataframe, compute my best 5-second, 1-minute, 5-minute, and 20-minute power outputs for each ride. Track how these "power bests" evolved month-over-month throughout 2025. Identify which duration showed the most improvement.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 1
          score: 1
          
        - question: Calculate efficiency factor (NP/avg HR) from activity_summary for rides >60km, but also compute a "real-time efficiency" metric from the primary dataframe as rolling 10-minute power divided by rolling 10-minute HR. Compare how the peak real-time efficiency within each ride correlates with the overall efficiency factor.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, identify all maximal efforts (segments where power exceeded 700W for at least 30 consecutive data points). Track the frequency and average duration of these efforts month-over-month. Has my ability to sustain high-power efforts improved?
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Compute and plot a mean-maximal power curve using the primary dataframe for each quarter of 2025 (durations from 5 seconds to 60 minutes). Calculate the percentage improvement at key durations (30s, 1min, 5min, 20min) between Q1 and the most recent quarter.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      technical:
        - question: Implement a fatigue resistance metric by comparing best 20-minute power in the first half of each long ride (>80km) versus the second half, using the primary dataframe. Conduct time series analysis on this metric to identify if my fatigue resistance shows seasonal patterns or progressive improvement.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      search_enabled:
        - question: Research the concept of Performance Management Chart (PMC) and the relationship between CTL, ATL, and TSB. Using my wellness data, create a PMC chart for 2025. Then, from the primary dataframe, compute my best 20-minute power for each week and overlay it on the PMC to identify if peak performances align with optimal TSB windows.
          datasets: [primary_df, wellness_data]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      context_enabled:
        - question: In the weeks my 20-minute power jumped the most, what was I saying in the days before and after those rides?
          datasets: [primary_df, activity_summary, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the rider; key - numbers first: best 20-minute power per week from the 1Hz data, the jumps found by a stated rule; then the rider's own words in a window of days either side (not the same day only), quoted and cited; a rendered quote marked as rendered; any count of fresh or good-day words named as the model's reading

  - category: Interval and Segment Analysis
    questions:
      coach_athlete:
        - question: From the primary dataframe, extract all continuous segments where power was between 280-320W (sweet spot zone) for at least 5 minutes. For each qualifying segment, calculate average HR, cadence, and HR drift (last 2 min avg HR minus first 2 min avg HR). Plot segment duration vs HR drift colored by month.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Using the activity_intervals data, identify rides with more than 4 laps where normalized power exceeded 300W. For these rides, extract the corresponding 1Hz data from primary_df and calculate the power standard deviation within each lap. Which lap position typically shows highest power variability?
          datasets: [primary_df, activity_intervals, activity_summary]
          join_required: true
          able_to_solve: false
          corrections: 0
          score: 0
          
        - question: From the primary dataframe, implement a "match burning" detector - identify segments where power exceeded 450W for at least 20 seconds followed by power dropping below 150W within 30 seconds. Count these "matches" per ride and correlate with total ride distance and normalized power from activity_summary.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Extract rolling 20-minute segments from the primary dataframe with step size of 5 minutes. For segments where average power exceeded (FTP), calculate the normalized power using the standard NP formula (30-second rolling average, 4th power, mean, 4th root). Plot the distribution of these segment NPs by quarter.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 1
          score: 1
          
      technical:
        - question: Implement a rolling window analysis on the primary dataframe to find the best 1, 5, 10, 20, and 60-minute power outputs within each ride. Then perform a Pareto efficiency analysis to identify rides that were "Pareto optimal" (not dominated by another ride at any duration). How many Pareto optimal rides do I have per month?
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 1
          score: 1
          
      search_enabled:
        - question: Research the concept of Critical Power (CP) and W' (W prime) using the 3-parameter CP model. From the primary dataframe, extract my best efforts at durations of 3, 5, 10, and 20 minutes for each month. Fit the CP model to estimate CP and W' monthly, and analyze how these parameters evolved throughout 2025.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      context_enabled:
        - question: When I set him interval sessions with a target, how close did he get to what I asked, and what did he say afterwards on the ones he did not manage?
          datasets: [primary_df, activity_summary, planned_workouts, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the coach; key - both at once: the coach's prescriptions found (the planned sessions, dated the day they were planned for - their steps, targets and structure in the planned workouts file since 2026-10-15, their prose in the words) paired to the rides; the intervals actually ridden detected in the 1Hz data against the stated repeats and target; compliance from the summary beside it; the sessions not done counted; his comments on the shortfalls quoted and cited

  - category: Environmental and Contextual Impact
    questions:
      coach_athlete:
        - question: From the primary dataframe, calculate instantaneous gradient and bin into categories. For each temperature range (<10°C, 10-20°C, >20°C), compute the average power output at each gradient category. Create a heatmap showing power as a function of both temperature and gradient.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 1
          score: 1
          
        - question: Using lap-level wind data from activity_intervals, identify laps with headwind_percent > 60% vs tailwind_percent > 60%. Join with primary_df to extract the second-by-second data for these laps. Compare the power and speed distributions between headwind and tailwind conditions.
          datasets: [primary_df, activity_intervals]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, identify climbing segments (sustained gradient > 4% for at least 2 minutes). For each climbing segment, calculate power-to-weight ratio, VAM (vertical ascent meters per hour), and average gradient. Rank my top 20 climbs by VAM.
          datasets: [primary_df, wellness_data]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Analyze the relationship between cadence and power output at different gradients using the primary dataframe. For flat terrain (-1% to 1%), moderate climbs (3-5%), and steep climbs (>6%), show the cadence-power relationship. Do I naturally shift to lower cadence on climbs?
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      technical:
        - question: Build a multiple regression model predicting instantaneous power from the primary dataframe using gradient, speed, cadence, heart rate, and temperature as features. Calculate feature importances and residuals. Identify rides or segments where actual power significantly exceeded predicted power (potential tailwind or drafting situations).
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      search_enabled:
        - question: Research the relationship between altitude and power output due to reduced air density. Using my primary dataframe, analyze if my power output differs systematically at different altitudes (binned by 25m intervals). Account for gradient as a confounding variable by comparing only flat segments across altitude bands.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      context_enabled:
        - question: He often blames the wind or the heat. Does what he says match what the bike recorded on those days?
          datasets: [primary_df, activity_summary, activity_intervals, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the coach; key - both at once: his remarks about conditions found in the words (by reading or by the codes, said which); temperature and headwind from the summary, the laps and the 1Hz trace on those rides; the disagreements flagged; his power-to-HR on those rides against rides of the same temperature band; quotes cited

  - category: Physiological Response and Efficiency
    questions:
      coach_athlete:
        - question: From the primary dataframe, calculate the power-to-HR ratio at each second. For each ride, track how this ratio changes over time by computing 10-minute rolling averages. Quantify the typical "cardiac drift" (percentage decline in power/HR ratio from first to last third of ride) for long rides (>80km) and compare across months.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Using the primary dataframe, identify steady-state segments (power CV < 10% over 5+ minutes). For these segments, calculate the HR-power relationship. Has my HR at a given power output (e.g., 200W) decreased over the course of 2025, indicating improved fitness?
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, analyze cadence-power coupling. For each ride, calculate the correlation between cadence and power. Identify rides with unusually low correlation (<0.3) and investigate - do these correspond to interval sessions or variable terrain?
          datasets: [primary_df, activity_intervals]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: On days where HRV was below my median (from wellness data), extract the corresponding ride data from primary_df. Compare the HR response to power on low-HRV days vs high-HRV days by calculating the average HR at power bins 150-180W, 180-210W, 210-240W, 240-270W, 270-300, 300-330, 330-360, >360).
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 1
          score: 1
          
      technical:
        - question: Implement the standard aerobic decoupling calculation from the primary dataframe. Split each ride >60min into halves, calculate efficiency factor (avg power / avg HR) for each half, and compute decoupling as (EF1 - EF2) / EF1 * 100. Compare this calculated value to aerobic_decoupling in activity_summary. Analyze discrepancies.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      search_enabled:
        - question: Research the concept of "lactate threshold" detection from power and heart rate data. Implement a method to estimate lactate threshold power from my primary dataframe by analyzing the HR-power relationship inflection point. Track estimated LT changes across 2025 and compare to my stated FTP.
          datasets: [primary_df, activity_summary]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      context_enabled:
        - question: On the days I said I was tired or sore, did my heart rate at a given power look any different from a fresh day? And did my morning ratings agree with what I wrote?
          datasets: [primary_df, wellness_data, activity_summary, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the rider; key - words first: tired/sore days and fresh days from the rider's own words (affirmations, not denials); HR at fixed power bins from the 1Hz data, normalised within the ride; the wellness ratings on the same dates; which pair agrees most; the day of the words against the day of the ride handled and said (the ride the message hangs off, or a window)

  - category: Workout Structure and Pacing
    questions:
      coach_athlete:
        - question: From the primary dataframe, divide each ride >80km into 10 equal-distance segments. Calculate normalized power for each segment. Classify each ride's pacing strategy as negative split (last 3 segments avg NP > first 3), positive split (opposite), or even (within 5%). Show the distribution of strategies by month.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Using the primary dataframe, detect "surges" - moments where power increased by >50% within 5 seconds and was sustained >600W for at least 10 seconds. Map surge locations (lat/lon) across all rides. Are there recurring locations (within 100m) where I frequently surge?
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, calculate the time spent in each power zone for each ride. Compute the "polarization index" as (time in Z1 + time in Z5) / total time. Compare polarization index between weekday and weekend rides, and correlate with ride duration from activity_summary.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: For rides with >5 laps in activity_intervals, calculate the lap-to-lap power variability (standard deviation of lap average powers). Join with primary_df to also compute the within-lap power variability (average of each lap's power SD). Which metric better predicts overall ride performance (NP)?
          datasets: [primary_df, activity_intervals, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      technical:
        - question: Implement a pacing strategy classifier using k-means clustering (k=4) on the power profile of each ride >60min. Use features extracted from primary_df - normalized power of each quartile of the ride, power coefficient of variation, and number of efforts >400W. Characterize each cluster and track cluster membership over time.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      search_enabled:
        - question: Research the concept of "Quadrant Analysis" in cycling (plotting cadence vs circumferential pedal velocity). Using my primary dataframe, create quadrant analysis plots for a sample of rides from each quarter. Analyze if my pedaling characteristics (time in each quadrant) have shifted over the year.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
      context_enabled:
        - question: Over the year, how often did he actually do the session I set him, and when he did not, did he tell me why?
          datasets: [activity_summary, planned_workouts, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the coach; key - plan versus done: the planned sessions (the planned workouts file: one row each, the skipped ones with no activity) paired to the rides; done, cut, extended, skipped or replaced, by month, with the unplanned rides counted; the reasons from his messages within a few days of the skipped and cut sessions, quoted and grouped; a planned session dated the day it was planned for
          
        - question: When I told him to pace a session a certain way, hold back early, build into it, keep under a number, did he? And did he notice himself when he did not?
          datasets: [primary_df, activity_summary, planned_workouts, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the coach; key - both at once: the pacing instructions found in the coach's words (the plan's prose in the context, its steps in the planned workouts file); power by quarter of the paired ride from the 1Hz data and the pacing classified; matched or not per session; his own comments on the mismatches quoted, or the absence of any said

  - category: Comparative Analysis
    questions:
      coach_athlete:
        - question: From the primary dataframe, calculate instantaneous gradient and identify all climbing segments (>3% for >1min) and descent segments (<-3% for >1min). Compare my average power, cadence, and HR on climbs vs descents. Also compute time spent coasting (power <30W) during descents.
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Compare weekend vs weekday rides across multiple metrics. From activity_summary get distance, NP, and training_load. From primary_df calculate percentage of time >threshold (FTP), number of high-power surges (>550W for >10s), and time in Z5. Are weekends more "quality" focused?
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Using the primary dataframe, compare my performance on repeated route segments. Identify GPS coordinates that appear in multiple rides (cluster lat/lon points within 50m). For segments I've ridden 5+ times, compare power and speed across attempts. Have I improved on familiar segments?
          datasets: [primary_df]
          join_required: false
          able_to_solve: true
          corrections: 1
          score: 1
          
        - question: From activity_intervals, identify the fastest and slowest laps (by average_speed) for each ride. Extract the corresponding 1Hz data from primary_df and compare power, cadence, HR, and gradient distributions between fastest and slowest laps. What characterizes my fast laps?
          datasets: [primary_df, activity_intervals]
          join_required: true
          able_to_solve: true
          corrections: 1
          score: 1
          
      technical:
        - question: Conduct a paired analysis comparing the first and second half of all long rides (>80km). From the primary dataframe, calculate for each half- NP, avg HR, time above threshold, cadence variability, and power-HR ratio. Use paired t-tests to identify which metrics show significant degradation in the second half.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      search_enabled:
        - question: Research the concept of "Training Stress Score" (TSS) calculation from power data. Using the primary dataframe and FTP, calculate TSS for each ride and compare to the power_load values in activity_summary. Investigate any systematic differences in how these metrics are computed.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      context_enabled:
        - question: Do the rides my coach comments on look any different from the ones he leaves alone? And when he is pleased, or not, does it show in the numbers?
          datasets: [primary_df, activity_summary, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the rider; key - numbers first: rides with a coach's comment or tick against the rest on power, load, compliance and time above FTP from the 1Hz data; then by the tone of the comment (the codes' tone or the analyst's reading, named as such); one comment quoted per group

  - category: Predictive Modeling and Performance Optimization
    questions:
      coach_athlete:
        - question: From the primary dataframe, extract features for each ride- best 5min power, time in Z4-Z5, average gradient, total elevation gain, and power variability. Combined with wellness metrics (CTL, fatigue, sleep_quality) from the day, build a model to predict normalized power. Which features dominate?
          datasets: [primary_df, activity_summary, wellness_data]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: Using the primary dataframe, calculate how much my average power decreases per 1000m of elevation gain within the same ride. Control for ride duration and temperature. Has this "elevation penalty" improved over the course of 2025?
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
        - question: From the primary dataframe, extract the power curve (best efforts from 10s to 30min) for each ride. Use these as features to cluster rides into "type" (endurance, tempo, threshold, VO2max focused). Correlate ride types with subsequent CTL changes from wellness data - which ride types most efficiently build fitness?
          datasets: [primary_df, wellness_data]
          join_required: true
          able_to_solve: true
          corrections: 0
          score: 1
          
      technical:
        - question: Use gradient boosting to predict whether a ride will have normalized power above my median, using features from wellness data (prior day's HRV, sleep, fatigue, resting HR, CTL, ATL) and ride characteristics from the first 10 minutes of primary_df data (avg power, avg HR, temperature). Can early-ride data improve predictions?
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 1

      search_enabled:
        - question: Research the "dose-response" relationship in endurance training and the concept of fitness-fatigue models. Using my data, implement a simple fitness-fatigue model where fitness responds to training load with a 42-day time constant and fatigue with a 7-day constant. Compare model predictions of performance to actual weekly best 20-min power from primary_df.
          datasets: [primary_df, wellness_data, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
      context_enabled:
        - question: If you had to predict how hard a ride would turn out, would what he had written in the days before help, on top of his sleep and HRV numbers?
          datasets: [primary_df, wellness_data, activity_summary, context_notes, context_codes]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          # asked as the coach; key - both at once: a model of normalized power from the prior day's wellness and the first minutes of the ride, then with features from the words (themes in the previous three days, their tone, whether a session was set for the day); out-of-sample error with and without; the word features named as the model's reading of what he wrote
# FINISHED HERE  
  - category: Geographic and Route Analysis
    questions:
      coach_athlete:
        - question: From the primary dataframe, cluster all GPS points using DBSCAN to identify frequently visited locations. For clusters with >500 data points (indicating regular routes), calculate my average power, speed, and HR across all visits. Show these "hot spots" on a map colored by average power.
          datasets: [primary_df]
          join_required: false
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: Find my longest ride by distance and extract its 1Hz data. Identify the fastest 30-minute segment by rolling average speed. Plot the entire ride's HR as a time series, highlighting the fastest segment. Create a second plot showing the route on a map with the fastest segment in a different color.
          datasets: [primary_df, activity_summary]
          join_required: true
          able_to_solve: null
          corrections: 0
          score: 0
          
        - question: From the primary dataframe, detect all significant climbs (elevation gain >50m with avg gradient >3%). For each climb, calculate length, average gradient, average power, VAM, and time. Create a "climb catalog" and identify my PR (best power) on climbs I've done multiple times.
          datasets: [primary_df]
          join_required: false
