# BambooAI - a tag v* builds the package and publishes it to PyPI (docs/OSS_DESIGN.md D21).
# Publishing uses PyPI's trusted publisher (OpenID Connect): no token lives in the repository.
# On pypi.org, project bambooai -> Publishing -> add: owner pgalko, repository BambooAI,
# workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
