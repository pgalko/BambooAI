# BambooAI - the suites on every push and pull request (docs/OSS_DESIGN.md D22).
# The battery (unit suites), the story end to end in all three compute modes, the persistence of the
# local store, and the package installed into a fresh virtualenv - all on a plain runner, with the
# stack's stand-ins for Auth0, Supabase, the orchestrator and Docker. A second job proves the executor
# image still builds.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"
          python -m playwright install --with-deps chromium
      - name: battery
        run: ./run_battery.sh
      - name: story - hosted edition (orchestrator stand-in)
        run: python tests/e2e/test_stack.py
      - name: story - self-hosted edition, local kernel
        run: python tests/e2e/test_stack.py --edition local --compute local
      - name: story - self-hosted edition, direct executor
        run: python tests/e2e/test_stack.py --edition local --compute direct
      - name: the local store survives a restart
        run: python tests/e2e/test_local_store.py
      - name: the package installs and serves
        run: python tests/e2e/test_package.py
      - name: start-up flows
        run: python tools/stack/flows.py --out /tmp/flows --delay 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flows-screenshots
          path: /tmp/flows
          if-no-files-found: ignore

  executor-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build the executor image (what `bambooai serve` builds on a user's machine)
        run: docker build -t bambooai-executor:ci containers/executor
      - name: the image answers /health
        run: |
          docker run -d --name ex -p 5055:5000 bambooai-executor:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5055/health && break; sleep 2; done
          curl -sf http://127.0.0.1:5055/health
          docker stop ex
