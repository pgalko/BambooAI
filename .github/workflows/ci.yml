# BambooAI - the checks on every push and pull request: the unit battery and the executor image.
# Both are deterministic on a plain runner. The browser suites and the package test run locally
# before every push (see README, Development); they are not run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"
      - run: ./run_battery.sh

  executor-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t bambooai-executor:ci containers/executor
          docker run -d --name ex -p 5055:5000 bambooai-executor:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5055/health && break; sleep 2; done
          curl -sf http://127.0.0.1:5055/health
          docker stop ex
